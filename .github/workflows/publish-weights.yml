name: Publish GLM-OCR weights

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Hugging Face revision (main resolves to exact commit SHA)
        type: string
        required: true
        default: main
      tag:
        description: GitHub Release tag
        type: string
        required: true
        default: glm-ocr-v1

permissions:
  contents: write

concurrency:
  group: glm-ocr-weights-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install streaming publisher dependencies
        run: python -m pip install --disable-pip-version-check 'huggingface_hub>=0.30,<2' 'requests>=2.32,<3'
      - name: Test chunking, recovery, and resume
        run: python -m unittest discover -s tests -v
      - name: Find existing draft or create new draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          sys.path.insert(0, "scripts")
          from stream_release import find_release
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["TAG"]
          release = find_release(repo, tag)
          if release is not None:
              if not release.get("draft"):
                  raise SystemExit("Release already published; refusing overwrite")
              print(f"Resuming draft {tag} ({len(release.get('assets', []))} assets)")
          else:
              subprocess.run([
                  "gh", "release", "create", tag, "--draft",
                  "--target", os.environ["GITHUB_SHA"], "--repo", repo,
                  "--title", "GLM-OCR model weights mirror",
                  "--notes", "Unmodified model snapshot: https://huggingface.co/zai-org/GLM-OCR. Source commit and SHA-256 hashes recorded in manifest.json. Please retain upstream attribution and licensing."
              ], check=True)
          PY
      - name: Stream upstream snapshot into GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REVISION: ${{ inputs.revision }}
          TAG: ${{ inputs.tag }}
        run: |
          python scripts/stream_release.py \
            --repo zai-org/GLM-OCR \
            --revision "$REVISION" \
            --out dist --chunk-mib 1024 \
            --release-tag "$TAG"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
